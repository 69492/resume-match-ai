services:
  - type: web
    name: resumematch-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_PDF_SIZE_MB
        value: "10"
